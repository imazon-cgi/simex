<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIMEX - Monitoramento de Exploração Madeireira</title>

  <!-- CSS libs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    .chartjs-legend li span{ border:0!important;width:14px;height:14px;border-radius:50%; }

    /* Loader */
    #loader-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background-color:rgba(255,255,255,.85);display:flex;justify-content:center;align-items:center;
      z-index:9999;transition:opacity .3s ease;
    }
    .loader-content{ text-align:center;padding:30px;background:#fff;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.15); }
    .spinner-border{ width:3rem;height:3rem;color:var(--primary-color); }
    .loader-text{ margin-top:15px;font-weight:600;color:var(--primary-dark);font-size:1.1rem; }

    :root{
      --primary-color:#008055;--primary-dark:#003300;--accent-color:#FF6D00;--text-color:#212121;
      --background-color:#F5F5F5;--card-color:#FFFFFF;--border-radius:12px;--box-shadow:0 6px 24px rgba(0,0,0,.08);
      --authorized-color:#28a745;--unauthorized-color:#dc3545;--analysis-color:#ff9800;
      --chart-h-desktop:450px;--chart-h-tablet:360px;--chart-h-phone:300px;
      --map-h-desktop:500px;--map-h-tablet:380px;--map-h-phone:320px;
    }
    body{ font-family:'Montserrat',sans-serif;background:var(--background-color);color:var(--text-color);padding:1.5rem; }

    .dashboard-header{
      text-align:center;margin-bottom:2rem;background:linear-gradient(135deg,var(--card-color),var(--card-color));
      padding:2rem;border-radius:var(--border-radius);box-shadow:var(--box-shadow);position:relative;
    }
    .dashboard-header::after{
      content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
      width:100px;height:5px;background:var(--accent-color);border-radius:5px;
    }

    .card{ border-radius:var(--border-radius);box-shadow:var(--box-shadow);border:none;height:100%;transition:transform .3s ease; }
    .card:hover{ transform:translateY(-5px); }
    .card-header{
      background:var(--card-color)!important;color:var(--primary-dark)!important;font-weight:700!important;
      border-bottom:2px solid var(--accent-color)!important;padding:1.25rem;font-size:1.1em;position:relative;
    }
    .card-header::after{ content:'';position:absolute;bottom:0;left:20px;width:50px;height:3px;background:var(--accent-color);border-radius:3px; }

    .filter-section{ background:var(--card-color);padding:1.5rem;border-radius:var(--border-radius);box-shadow:var(--box-shadow);margin-bottom:2rem; }

    /* Nova estrutura de filtros seguindo o padrão SAD */
    .filter-container {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      align-items: end;
    }
    .filter-item { display: flex; flex-direction: column; gap: 6px; }
    .span-3 { grid-column: span 3; }
    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }
    .span-1 { grid-column: span 1; }

    .form-select, .form-control {
      height: 42px;
      border-radius: 8px;
      border: 1px solid #ddd;
      transition: all .3s ease;
    }
    .form-select:focus, .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0,128,85,.2);
    }

    #map{ height:var(--map-h-desktop);width:100%;border-radius:var(--border-radius);box-shadow:inset 0 0 10px rgba(0,0,0,.1);position:relative; }
    .chart-container{ position:relative;height:var(--chart-h-desktop);width:100%; }

    .btn-primary{ 
      background:var(--primary-color);border-color:var(--primary-color);border-radius:8px;
      font-weight:600;transition:all .3s ease;padding:10px 20px; height: 42px;
    }
    .btn-primary:hover{ background:var(--primary-dark);border-color:var(--primary-dark);transform:translateY(-2px); }
    .btn-secondary{ height:42px; border-radius:8px; font-weight:600; }

    .info-panel{
      position:absolute;top:20px;right:20px;z-index:1000;background:#fff;padding:15px;border-radius:8px;box-shadow:var(--box-shadow);
      font-size:.9rem;max-width:300px;
    }

    .stat-card{ background:var(--primary-color);color:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 4px 8px rgba(0,0,0,.1); }
    .stat-value{ font-size:1.8rem;font-weight:bold;margin:5px 0; }
    .stat-label{ font-size:.9rem;opacity:.9; }

    .settlement-item{ padding:10px 15px;border-bottom:1px solid #eee;cursor:pointer;transition:all .2s; }
    .settlement-item:hover{ background:#f0f8ff; }
    .settlement-item.selected{ background:#e0f7e9;font-weight:600; }
    .selection-info{ padding:10px 0;font-weight:500;color:var(--text-color); }

    .modal-terras-indigenas .modal-content{ border-radius:var(--border-radius);overflow:hidden; }
    .modal-terras-indigenas .modal-header{ background:var(--primary-color);color:#fff; }
    .modal-terras-indigenas .modal-footer .btn{ border-radius:8px;font-weight:600;padding:8px 20px; }

    .fase-filter-group{ display:none; }
    .jurisdicao-filter-group{ display:none; }
    .uso-filter-group{ display:none; }

    .download-group{ display:flex;gap:6px; }
    .download-group.d-none{ display:none!important; }
    .dl-toggle{ margin-left:8px; }
    .toast-container{ z-index:11000; }

    @media (max-width: 992px){
      body{ padding:1rem; } .dashboard-header{ padding:1.5rem; }
      #map{ height:var(--map-h-tablet); } .chart-container{ height:var(--chart-h-tablet); }
      .info-panel{ top:10px;right:10px;max-width:200px;padding:10px; }
      .filter-container{ grid-template-columns: repeat(2, 1fr); }
      .span-3, .span-2, .span-4, .span-1 { grid-column: span 2; }
    }
    @media (max-width: 576px){
      .chart-container{ height:var(--chart-h-phone); } #map{ height:var(--map-h-phone); }
      .stat-card{ padding:10px; } .stat-value{ font-size:1.5rem; }
      .filter-container{ grid-template-columns: 1fr; }
      .span-3, .span-2, .span-4, .span-1 { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader-overlay">
    <div class="loader-content">
      <div class="spinner-border" role="status"><span class="visually-hidden">Carregando...</span></div>
      <div class="loader-text">Carregando dados...</div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toastAviso" class="toast align-items-center text-bg-warning border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">Não encontrei dados para o(s) item(ns) selecionado(s) no ano atual. Mantive os demais filtros.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="dashboard-header">
      <img src="/../../img/simex.png" style="max-width:180px;margin:auto" alt="Logo IMAZON">
    </div>

    <!-- Filtros -->
    <div class="filter-section">
      <div class="filter-container">
        <div class="filter-item span-2">
          <label class="form-label fw-bold" for="exploracaoFilter">SIMEX</label>
          <select id="exploracaoFilter" class="form-select">
            <option value="all">Todos</option>
            <option value="autorizada">Autorizada</option>
            <option value="nao autorizada">Não Autorizada</option>
            <option value="analise">Em Análise</option>
          </select>
        </div>

        <div class="filter-item span-2">
          <label class="form-label fw-bold" for="estadoFilter">Estado</label>
          <select id="estadoFilter" class="form-select">
            <option value="all">Amazônia Legal</option>
            <option value="AC">Acre</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="PA">Pará</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="TO">Tocantins</option>
          </select>
        </div>

        <div class="filter-item span-2">
          <label class="form-label fw-bold" for="categoriaFilter">Modalidade Territorial</label>
          <select id="categoriaFilter" class="form-select">
            <option value="terras">Terras Indígenas</option>
            <option value="uc">Unidades de Conservação</option>
            <option value="assentamentos">Assentamentos</option>
            <option value="terras_sem_destinacao">Terras Sem Destinação</option>
            <option value="imoveis">Imóveis Rurais</option>
          </select>
        </div>

        <div class="filter-item span-2 fase-filter-group" id="faseFilterGroup" style="display:none;">
          <label class="form-label fw-bold" for="faseFilter">Fase</label>
          <select id="faseFilter" class="form-select">
            <option value="all">Todos</option>
            <option value="Regularizada">Regularizada</option>
            <option value="Em estudo">Em estudo</option>
            <option value="Delimitada">Delimitada</option>
            <option value="Declarada">Declarada</option>
            <option value="Homologada">Homologada</option>
          </select>
        </div>

        <div class="filter-item span-2 jurisdicao-filter-group" id="jurisdicaoFilterGroup" style="display:none;">
          <label class="form-label fw-bold" for="jurisdicaoFilter">Jurisdição</label>
          <select id="jurisdicaoFilter" class="form-select">
            <option value="all">Todos</option>
            <option value="Federal">Federal</option>
            <option value="Estadual">Estadual</option>
          </select>
        </div>

        <div class="filter-item span-2 uso-filter-group" id="usoFilterGroup" style="display:none;">
          <label class="form-label fw-bold" for="usoFilter">Tipos de Uso</label>
          <select id="usoFilter" class="form-select">
            <option value="all">Todos</option>
            <option value="Uso Sustentável">Uso Sustentável</option>
            <option value="Proteção Integral">Proteção Integral</option>
          </select>
        </div>

        <div class="filter-item span-2">
          <label class="form-label fw-bold" for="yearFilter">Ano</label>
          <select id="yearFilter" class="form-select"></select>
        </div>

        <!-- Botões de seleção (modais) -->
        <div class="filter-item span-3 dataset-select-group align-self-end" id="terrasSelectGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-terras-modal"><i class="fas fa-mountain me-2"></i>Selecionar Terras</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="municipiosSelectGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-municipios-modal"><i class="fas fa-city me-2"></i>Selecionar Municípios</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="estadosSelectGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-estados-modal"><i class="fas fa-flag me-2"></i>Selecionar Estados</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="imoveisSelectGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-imoveis-modal"><i class="fas fa-tractor me-2"></i>Selecionar Imóveis</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="assentamentosSelectGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-assentamentos-modal"><i class="fas fa-users me-2"></i>Selecionar Assentamentos</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="terrasSemDestinacaoGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-terras-sem-destinacao-modal"><i class="fas fa-globe-americas me-2"></i>Selecionar Terras Sem Destinação</button>
        </div>
        <div class="filter-item span-3 dataset-select-group align-self-end" id="ucGroup" style="display:none;">
          <button class="btn btn-primary w-100" id="open-uc-modal"><i class="fas fa-tree me-2"></i>Selecionar UCs</button>
        </div>

        <div class="filter-item span-2">
          <button class="btn btn-primary w-100" id="apply-filters"><i class="fas fa-filter me-2"></i>Aplicar Filtro</button>
        </div>
        <div class="filter-item span-2">
          <button class="btn btn-secondary w-100" id="clear-selections"><i class="fas fa-eraser me-2"></i>Limpar Filtros</button>
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="stat-card">
          <div class="stat-label">Área Total</div>
          <div class="stat-value" id="total-area">0 ha</div>
          <div>no período selecionado</div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="stat-card" style="background-color:#006064;">
          <div class="stat-label">Territórios Afetados</div>
          <div class="stat-value" id="affected-count">0</div>
          <div>no período</div>
        </div>
      </div>
    </div>

    <!-- Gráficos e Mapa -->
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <div class="chart-header-container d-flex justify-content-between align-items-center">
              <div class="chart-title"><i class="fas fa-chart-bar me-2"></i>Ranking</div>
              <div class="d-flex align-items-center">
                <div class="download-group d-none">
                  <button class="btn btn-sm btn-outline-secondary" id="download-bar-png" title="PNG"><i class="fa-solid fa-image me-1"></i>PNG</button>
                  <button class="btn btn-sm btn-outline-secondary" id="download-bar-csv" title="CSV (todos)"><i class="fa-solid fa-file-csv me-1"></i>CSV</button>
                </div>
                <button class="btn btn-sm btn-outline-secondary dl-toggle ms-2" aria-pressed="true" title="Mostrar downloads"><i class="fas fa-eye me-1"></i>Mostrar</button>
              </div>
            </div>
          </div>
          <div class="card-body"><div class="chart-container"><canvas id="barChart"></canvas></div></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <div class="chart-header-container d-flex justify-content-between align-items-center">
              <div class="chart-title"><i class="fas fa-map me-2"></i>Mapa</div>
              <div class="d-flex align-items-center">
                <div class="download-group d-none">
                  <button class="btn btn-sm btn-outline-secondary" id="download-map-png" title="PNG (toda a camada)"><i class="fa-solid fa-image me-1"></i>PNG</button>
                </div>
                <button class="btn btn-sm btn-outline-secondary dl-toggle ms-2" aria-pressed="true" title="Mostrar downloads"><i class="fas fa-eye me-1"></i>Mostrar</button>
              </div>
            </div>
          </div>
          <div class="card-body position-relative">
            <div id="info-panel" class="info-panel" style="display:none;">
              <div><strong><span id="selected-rank"></span>º</strong> — <span id="selected-name"></span></div>
              <div>Área: <span id="selected-area"></span></div>
            </div>
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-2">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <div class="chart-header-container d-flex justify-content-between align-items-center">
              <div class="chart-title"><i class="fas fa-chart-line me-2"></i>Gráfico Série Histórica</div>
              <div class="d-flex align-items-center">
                <div class="download-group d-none">
                  <button class="btn btn-sm btn-outline-secondary" id="download-line-png" title="PNG"><i class="fa-solid fa-image me-1"></i>PNG</button>
                  <button class="btn btn-sm btn-outline-secondary" id="download-line-csv" title="CSV" disabled aria-disabled="true">
                    <i class="fa-solid fa-file-csv me-1"></i>CSV
                  </button>
                </div>
                <button class="btn btn-sm btn-outline-secondary dl-toggle ms-2" aria-pressed="true" title="Mostrar downloads"><i class="fas fa-eye me-1"></i>Mostrar</button>
              </div>
            </div>
          </div>
          <div class="card-body"><div class="chart-container"><canvas id="lineChart"></canvas></div></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <div class="chart-header-container d-flex justify-content-between align-items-center">
              <div class="chart-title"><i class="fas fa-chart-area me-2"></i>Série Histórica Anual</div>
              <div class="d-flex align-items-center">
                <div class="download-group d-none">
                  <button class="btn btn-sm btn-outline-secondary" id="download-yearly-png" title="PNG"><i class="fa-solid fa-image me-1"></i>PNG</button>
                  <button class="btn btn-sm btn-outline-secondary" id="download-yearly-csv" title="CSV"><i class="fa-solid fa-file-csv me-1"></i>CSV</button>
                </div>
                <button class="btn btn-sm btn-outline-secondary dl-toggle ms-2" aria-pressed="true" title="Mostrar downloads"><i class="fas fa-eye me-1"></i>Mostrar</button>
              </div>
            </div>
          </div>
          <div class="card-body"><div class="chart-container"><canvas id="yearlyChart"></canvas></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modais (iguais ao seu código anterior) -->
  <!-- ... [mantidos conforme o seu último envio, omitidos aqui para brevidade visual] ... -->
  <!-- Copie os mesmos modais do seu arquivo atual — não houve alteração neles. -->

  <!-- JS libs -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-scale-chromatic.v3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    /* ===========================
       CONSTANTES E HELPERS
    ============================ */
    const UF_NAMES = {
      AC:'Acre', AL:'Alagoas', AM:'Amazonas', AP:'Amapá', BA:'Bahia', CE:'Ceará', DF:'Distrito Federal',
      ES:'Espírito Santo', GO:'Goiás', MA:'Maranhão', MG:'Minas Gerais', MS:'Mato Grosso do Sul',
      MT:'Mato Grosso', PA:'Pará', PB:'Paraíba', PE:'Pernambuco', PI:'Piauí', PR:'Paraná',
      RJ:'Rio de Janeiro', RN:'Rio Grande do Norte', RO:'Rondônia', RR:'Roraima', RS:'Rio Grande do Sul',
      SC:'Santa Catarina', SE:'Sergipe', SP:'São Paulo', TO:'Tocantins'
    };
    const UF_BY_NAME = Object.fromEntries(Object.entries(UF_NAMES)
      .map(([uf, nome]) => [nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''), uf]));
    const norm = s => (s ?? '').toString().trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'');

    const AMAZONIA_LEGAL_UF = ['AC','AP','AM','MT','PA','RO','RR','TO','MA'];

    function showLoader(message="Carregando dados..."){
      const loader = document.getElementById('loader-overlay');
      if (!loader) return;
      const textEl = loader.querySelector('.loader-text');
      if (textEl) textEl.textContent = message;
      loader.style.display = 'flex';
    }
    function hideLoader(){
      const loader = document.getElementById('loader-overlay');
      if (loader) loader.style.display = 'none';
    }

    Chart.register(ChartDataLabels);
    Chart.defaults.font.family = "'Montserrat', sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.font.weight = '500';

    let selectedTerras = [];
    let selectedMunicipios = [];
    let selectedEstados = [];
    let selectedImoveis = [];
    let selectedAssentamentos = [];
    let selectedTerrasSemDestinacao = [];
    let selectedUCs = [];

    let currentBarData = { labels: [], values: [] };
    let currentLineData = { labels: [], datasets: [] };
    let currentYearlyData = { labels: [], values: [] };

    const DATASET_LABELS = {
      estados:"Estados", municipios:"Municípios", terras:"Terras Indígenas",
      terras_sem_destinacao:"Terras Sem Destinação", assentamentos:"Assentamentos",
      imoveis:"Imóveis Rurais", uc:"Unidades de Conservação"
    };

    const DATASETS = {
      assentamentos:{
        geo:'/dataset/simex/geojson/simex_amazonia_PAMT2007_2023_assentamentos.geojson',
        csv:'/dataset/simex/csv/simex_amazonia_PAMT2007_2023_assentamentos.csv',
        geoField:'name',
        parse:d=>({ year:+d.ano||null,month:null,state:d.sigla_uf,category:d.categoria||'',
          area:(+d.area_ha||0)/100,name:d.name })
      },
      imoveis:{
        geo:'/dataset/simex/geojson/simex_amazonia_PAMT2007_2023_imoveisrurais.geojson',
        csv:'/dataset/simex/csv/simex_amazonia_PAMT2007_2023_imoveisrurais.csv',
        geoField:'nome',
        parse:d=>({ year:+d.ano||null,month:null,state:d.sigla_uf,category:d.categoria||'',
          area:(+d.area_ha||0)/100,name:d.nome })
      },
      municipios:{
        geo:'/dataset/simex/geojson/simex_amazonia_PAMT2007_2023_mun.geojson',
        csv:'/dataset/simex/csv/simex_amazonia_PAMT2007_2023_municipios.csv',
        geoField:'nome',
        parse:d=>({ year:+d.ano||null,month:null,state:d.sigla_uf,category:d.categoria||'',
          area:(+d.area_ha||0)/100,name:d.nome })
      },
      estados:{

    // Normalizações
    const _norm = s => (s ?? '').toString().trim().toUpperCase();
    function normalizeCategory(raw=''){
      if (!raw) return 'outros';
      const c = raw.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      if (c.includes('nao autorizada') || c.includes('ilegal')) return 'nao autorizada';
      if (c.includes('autorizada')) return 'autorizada';
      if (c.includes('analise')) return 'analise';
      return 'outros';
    }

    /* ===========================
       MAPA: INICIALIZAÇÃO
    ============================ */
    function mapInit(){
      map = L.map('map', { zoomControl:true });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        crossOrigin: true,
        maxZoom: 19
      }).addTo(map);

      // Panes: base (Amazônia Legal) e overlay (ranking)
      map.createPane('base-legal');
      map.getPane('base-legal').style.zIndex = 300;         // abaixo do overlay, acima dos tiles
      map.getPane('base-legal').style.pointerEvents = 'none';

      map.createPane('overlay-ranked');
      map.getPane('overlay-ranked').style.zIndex = 450;

      // Carrega a Amazônia Legal uma única vez
      loadAmazoniaBase();
    }

    async function loadAmazoniaBase(){
      try{
        const gj = await fetch(AMAZONIA_BASE_URL).then(r=>r.json());
        if (baseAmazonLayer) { map.removeLayer(baseAmazonLayer); baseAmazonLayer=null; }
        baseAmazonLayer = L.geoJSON(gj, {
          pane:'base-legal',
          interactive:false,
          style: {
            color:'#2e7d32',      /* contorno */
            weight:1.2,
            fillColor:'#e8f5e9',  /* preenchimento */
            fillOpacity:0.55
          }
        }).addTo(map);
        baseBounds = baseAmazonLayer.getBounds();
        if (baseBounds && baseBounds.isValid()) {
          map.fitBounds(baseBounds, { padding:[20,20] });
        }
      }catch(e){
        console.error('Falha ao carregar a Amazônia Legal:', e);
      }
    }

       DADOS E GRÁFICOS

    const populateYearFilter = (years) => {
      yearFilter.innerHTML = '';
      years.forEach(y => {

        opt.value = y; opt.textContent = y;
        yearFilter.appendChild(opt);
      });
      yearFilter.value = String(Math.max(...years));
    };

    const loadData = async () => {
      showLoader("Carregando dados...");
      const spec = DATASETS[currentDataset];

      // GeoJSON principal do dataset
      const geoResponse = await fetch(spec.geo);
      geojson = await geoResponse.json();

      featureMap.clear();
      if (currentDataset === 'estados') {
        const byUF = new Map();
        for (const f of geojson.features) {
          const uf = (f.properties?.sigla_uf || f.properties?.UF || '').trim();
          if (!uf) continue;
          if (!byUF.has(uf)) byUF.set(uf, []);
          byUF.get(uf).push(f);
        }
        for (const [uf, feats] of byUF.entries()) {
          const name = UF_NAMES[uf] || uf;
          let bounds = null;
          feats.forEach(feat => {
            const b = L.geoJSON(feat).getBounds();
            bounds = bounds ? bounds.extend(b) : b;
          });
          const descriptor = { type:'estado', uf, name, feats, bounds };
          featureMap.set(name, descriptor);
          featureMap.set(norm(name), descriptor);
        }
      } else {
        const spec2 = DATASETS[currentDataset];
        geojson.features.forEach(f => {
          const name = f.properties[spec2.geoField];
          if (name) {
            featureMap.set(name, f);
            featureMap.set(norm(name), f);
          }
        });
      }

      // CSV
      const csvResponse = await fetch(spec.csv);
      const text = await csvResponse.text();
      csvData = d3.csvParse(text, spec.parse);
      csvData.forEach(d => d.normalizedCategory = normalizeCategory(d.category));

      if (currentDataset === 'municipios' || currentDataset === 'estados') {
        csvData = csvData.filter(d => AMAZONIA_LEGAL_UF.includes(d.state));
      }

      const years = [...new Set(csvData.map(d => d.year))].sort((a,b)=>a-b);
      populateYearFilter(years);

      // mostrar/ocultar grupos
      faseFilterGroup.style.display = currentDataset === 'terras' ? 'block' : 'none';
      document.getElementById('terrasSelectGroup').style.display = currentDataset === 'terras' ? 'block' : 'none';
      document.getElementById('municipiosSelectGroup').style.display = currentDataset === 'municipios' ? 'block' : 'none';
      document.getElementById('estadosSelectGroup').style.display = currentDataset === 'estados' ? 'block' : 'none';
      document.getElementById('imoveisSelectGroup').style.display = currentDataset === 'imoveis' ? 'block' : 'none';
      document.getElementById('assentamentosSelectGroup').style.display = currentDataset === 'assentamentos' ? 'block' : 'none';
      document.getElementById('terrasSemDestinacaoGroup').style.display = currentDataset === 'terras_sem_destinacao' ? 'block' : 'none';
      document.getElementById('ucGroup').style.display = currentDataset === 'uc' ? 'block' : 'none';
    };

    function triggerDownload(href, filename){
      const a = document.createElement('a');
      a.href = href; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    function downloadCSV(content, fileName){
      const blob = new Blob([content], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      triggerDownload(url, fileName);
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
    }
    function downloadChartPNG(chartInstance, fileName){

          onHover:(evt,els)=>{ evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
          onClick:(e,els)=>{
            if (!els.length) return;
            const idx = els[0].index;

    /* ===========================
       MAPA: OVERLAY DO RANKING (ACIMA DO FUNDO AMAZÔNIA)
    ============================ */
    function updateMap(aggData, namesToShow){
      if (geoLayer) { map.removeLayer(geoLayer); geoLayer = null; }
      if (!geojson || !Array.isArray(geojson.features)) {
        if (baseBounds && baseBounds.isValid()) map.fitBounds(baseBounds, { padding:[20,20] });
        return;
      }

      const props0 = geojson.features[0]?.properties || {};
      const hasSiglaUF = 'sigla_uf' in props0 || 'UF' in props0;
      const okGeom = f => { const g=f?.geometry; return !!(g && g.type!=='GeometryCollection'); };
      const maxVal = Math.max(...(namesToShow||[]).map(n => aggData[n] || 0), 0);
      const colorScale = d3.scaleSequential(d3.interpolateReds).domain([0, maxVal || 1]);

      let featuresToDraw = [];
      if (namesToShow?.length){
        if (currentDataset==='estados' && hasSiglaUF){
          const wantedUFs = new Set(namesToShow.map(n => UF_BY_NAME[norm(n)]).filter(Boolean));
          featuresToDraw = geojson.features.filter(f => {
            const uf = (f.properties.sigla_uf || f.properties.UF || '').toString().trim();
            return uf && wantedUFs.has(uf) && okGeom(f);
          });
          const muniToStateName = f => {
            const uf = (f.properties.sigla_uf || f.properties.UF || '').toString().trim();
            return UF_NAMES[uf] || uf;
          };
          geoLayer = L.geoJSON(featuresToDraw, {
            pane:'overlay-ranked',
            style:f => {
              const stateName = muniToStateName(f);
              const v = aggData[stateName] || 0;
              return { color:'#555', weight:.6, fillColor:colorScale(v), fillOpacity:.72 };
            },
            onEachFeature:(f,layer)=>{
              const stateName = muniToStateName(f);
              const v = aggData[stateName] || 0;
              const rank = namesToShow.findIndex(n => norm(n)===norm(stateName)) + 1;
              layer.on({
                mouseover:e=>{
                  e.target.setStyle({ weight:2 });
                  if (infoPanel){
                    selectedNameEl.textContent = stateName;
                    selectedAreaEl.textContent = v.toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' ha';
                    selectedRankEl.textContent = rank;
                    infoPanel.style.display = 'block';
                  }
                },
                mouseout:e=>{
                  e.target.setStyle({ weight:.6 });
                  if (infoPanel) infoPanel.style.display = 'none';
                }
              });
            }
          }).addTo(map);
        } else {
          const labelField = DATASETS[currentDataset].geoField;
          const wanted = new Set((namesToShow||[]).map(n => n.toLowerCase()));
          featuresToDraw = geojson.features.filter(f => {
            const raw = String(f.properties?.[labelField] ?? '');
            return okGeom(f) && wanted.has(raw.toLowerCase());
          });
          geoLayer = L.geoJSON(featuresToDraw, {
            pane:'overlay-ranked',
            style:f=>{
              const displayName = String(f.properties?.[labelField] ?? '');
              const v = aggData[displayName] || 0;
              return { color:'#555', weight:1, fillColor:colorScale(v), fillOpacity:.72 };
            },
            onEachFeature:(f,layer)=>{
              const displayName = String(f.properties?.[labelField] ?? '');
              const v = aggData[displayName] || 0;
              const rank = namesToShow.findIndex(n => n.toLowerCase()===displayName.toLowerCase()) + 1;
              layer.bindPopup(`<b>${rank}º - ${displayName}</b><br>Área: ${v.toLocaleString('pt-BR',{maximumFractionDigits:2})} ha`);
              layer.on({
                mouseover:e=>{
                  e.target.setStyle({ weight:3 });
                  if (infoPanel){
                    selectedNameEl.textContent = displayName;
                    selectedAreaEl.textContent = v.toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' ha';
                    selectedRankEl.textContent = rank;
                    infoPanel.style.display = 'block';
                  }
                },
                mouseout:e=>{ e.target.setStyle({ weight:1 }); if (infoPanel) infoPanel.style.display='none'; }
              });
            }
          }).addTo(map);
        }
      }

      // Ajuste de visão: prioriza feições do ranking; se não houver, enquadra a Amazônia Legal
      const b = geoLayer && geoLayer.getBounds && geoLayer.getBounds();
      if (b && b.isValid && b.isValid()) {
        map.fitBounds(b, { padding:[30,30] });
      } else if (baseBounds && baseBounds.isValid()) {
        map.fitBounds(baseBounds, { padding:[20,20] });
      }
    }

    /* ===========================

    function getActiveSelectionForCurrentDataset(){
      switch(currentDataset){
        case 'terras':return selectedTerras;
        case 'municipios':return selectedMunicipios;
        case 'estados':return selectedEstados;
        case 'imoveis':return selectedImoveis;
        case 'assentamentos':return selectedAssentamentos;
        case 'terras_sem_destinacao':return selectedTerrasSemDestinacao;
        case 'uc':return selectedUCs;
        default:return [];
      }
    }
    function setActiveSelectionForCurrentDataset(newList){
      switch(currentDataset){
        case 'terras': selectedTerras = [...newList]; break;
        case 'municipios': selectedMunicipios = [...newList]; break;
        case 'estados': selectedEstados = [...newList]; break;
        case 'imoveis': selectedImoveis = [...newList]; break;
        case 'assentamentos': selectedAssentamentos = [...newList]; break;
        case 'terras_sem_destinacao': selectedTerrasSemDestinacao = [...newList]; break;
        case 'uc': selectedUCs = [...newList]; break;
      }
    }
    function selectionNamesAvailableInYear(year){
      const availableMap = new Map();
      csvData.filter(d => d.year===year && d.name).forEach(d => {
        const key = d.name.toLowerCase();
        if (!availableMap.has(key)) availableMap.set(key, d.name);
      });
      const sel = getActiveSelectionForCurrentDataset();
      const out = []; const seen = new Set();
      sel.forEach(n => {
        const canon = availableMap.get(n.toLowerCase());
        if (canon && !seen.has(canon)) { out.push(canon); seen.add(canon); }
      });
      return out;
    }

    function toggleUCFilters() {
      const show = currentDataset === 'uc';
      document.getElementById('jurisdicaoFilterGroup').style.display = show ? 'block' : 'none';
      document.getElementById('usoFilterGroup').style.display = show ? 'block' : 'none';
    }

    function updateDashboard(){
      const year = +yearFilter.value;
      const fase = currentDataset==='terras' ? faseFilter.value : 'all';
      const estado = estadoFilter.value;
      const jurisdicao = currentDataset==='uc' ? jurisdicaoFilter.value : 'all';
      const uso = currentDataset==='uc' ? usoFilter.value : 'all';

      const hadSelectionBefore = getActiveSelectionForCurrentDataset().length > 0;
      const activeSel = selectionNamesAvailableInYear(year);
      if (hadSelectionBefore && activeSel.length === 0) {
        setActiveSelectionForCurrentDataset([]);
        const toastEl = document.getElementById('toastAviso');
        if (toastEl) bootstrap.Toast.getOrCreateInstance(toastEl).show();
      }

      let filtered = csvData.filter(d => d.year === year);
      if (currentCategoryFilter !== 'all') filtered = filtered.filter(d => d.normalizedCategory === currentCategoryFilter);
      if (fase !== 'all' && currentDataset==='terras') filtered = filtered.filter(d => d.fase === fase);
      if (estado !== 'all' && currentDataset !== 'estados') filtered = filtered.filter(d => d.state === estado);
      if (currentDataset==='uc') {
        if (jurisdicao !== 'all') filtered = filtered.filter(d => d.jurisdicao === jurisdicao);
        if (uso !== 'all') filtered = filtered.filter(d => d.uso === uso);
      }
      if (activeSel.length > 0) filtered = filtered.filter(d => activeSel.includes(d.name));

      const agg = {};
      filtered.forEach(d => { if (d.name) agg[d.name] = (agg[d.name]||0) + d.area; });

      let sorted;
      if (activeSel.length > 0) {
        sorted = activeSel.map(n => [n, agg[n]||0]).filter(([,v]) => v>0).sort(([,a],[,b])=>b-a).slice(0,10);
      } else {
        sorted = Object.entries(agg).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,10);
      }
      const labels = sorted.map(([n])=>n);
      const values = sorted.map(([,v])=>v);

      const datasetLabel = DATASET_LABELS[currentDataset] || "Itens";
      const rankingTitleEl = document.querySelector('.card .chart-title i.fa-chart-bar')?.parentNode;
      if (rankingTitleEl) rankingTitleEl.innerHTML = `<i class="fas fa-chart-bar me-2"></i>Ranking de ${datasetLabel} mais explorados`;
      const mapTitleEl = document.querySelector('.card .chart-title i.fa-map')?.parentNode;
      if (mapTitleEl) mapTitleEl.innerHTML = `<i class="fas fa-map me-2"></i>Mapa de ${datasetLabel}`;

      updateStats(agg);
      updateBarChart(labels, values);
      updateLineChart(year, labels);
      updateYearlyChart();
      updateMap(agg, labels);

      hideLoader();
    }

    /* ===========================
       MODAIS / EVENTOS
    ============================ */
    function populateList(listId, searchId, selectedList, countId){
      const listEl = document.getElementById(listId);
      const termEl = document.getElementById(searchId);
      const term = (termEl ? termEl.value : '').toLowerCase();
      const year = +yearFilter.value;

      const names = [...new Set(csvData.filter(d => d.year===year && d.name).map(d => d.name))].sort();
      listEl.innerHTML = '';

      const allSelected = names.length > 0 && names.every(n => selectedList.includes(n));
      const allItem = document.createElement('div');
      allItem.className = `settlement-item ${allSelected ? 'selected' : ''}`;
      allItem.textContent = 'Todos';
      allItem.onclick = () => {
        if (allSelected) { selectedList.length = 0; }
        else { selectedList.length = 0; for (const n of names) selectedList.push(n); }
        populateList(listId, searchId, selectedList, countId);
      };
      listEl.appendChild(allItem);

      names.filter(n => n.toLowerCase().includes(term)).forEach(name => {
        const sel = selectedList.includes(name);
        const item = document.createElement('div');
        item.className = `settlement-item ${sel ? 'selected' : ''}`;
        item.textContent = name;
        item.onclick = () => {
          if (!sel && selectedList.length >= 10) { alert('Máximo 10 selecionados (exceto quando usar "Todos")'); return; }
          if (sel) selectedList.splice(selectedList.indexOf(name), 1);
          else selectedList.push(name);
          populateList(listId, searchId, selectedList, countId);
        };
        listEl.appendChild(item);
      });

      const countEl = document.getElementById(countId);
      if (countEl) countEl.textContent = selectedList.length;
    }

    function liberarScroll(){
      document.body.classList.remove('modal-open');
      document.body.style.removeProperty('overflow');
      document.body.style.removeProperty('padding-right');
      document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
    }

    function setUpModalListeners(){
      const CONFIG = [
        ['open-terras-modal','terrasModal','terras-list','terras-search','selected-terras-count',selectedTerras,'apply-terras-selection'],
        ['open-municipios-modal','municipiosModal','municipios-list','municipios-search','selected-municipios-count',selectedMunicipios,'apply-municipios-selection'],
        ['open-estados-modal','estadosModal','estados-list','estados-search','selected-estados-count',selectedEstados,'apply-estados-selection'],
        ['open-imoveis-modal','imoveisModal','imoveis-list','imoveis-search','selected-imoveis-count',selectedImoveis,'apply-imoveis-selection'],
        ['open-assentamentos-modal','assentamentosModal','assentamentos-list','assentamentos-search','selected-assentamentos-count',selectedAssentamentos,'apply-assentamentos-selection'],
        ['open-uc-modal','ucModal','uc-list','uc-search','selected-uc-count',selectedUCs,'apply-uc-selection'],
        ['open-terras-sem-destinacao-modal','terrasSemDestinacaoModal','terras-sem-destinacao-list','terras-sem-destinacao-search','selected-terras-sem-destinacao-count',selectedTerrasSemDestinacao,'apply-terras-sem-destinacao-selection'],
      ];

      CONFIG.forEach(([openId, modalId, listId, searchId, countId, store, applyId])=>{
        const openBtn = document.getElementById(openId);
        const modalEl = document.getElementById(modalId);
        const applyBtn = document.getElementById(applyId);
        if (!openBtn || !modalEl || !applyBtn) return;

        openBtn.addEventListener('click', () => {
          populateList(listId, searchId, store, countId);
          new bootstrap.Modal(modalEl).show();
        });
        applyBtn.addEventListener('click', () => {
          modalEl.addEventListener('hidden.bs.modal', () => { updateDashboard(); liberarScroll(); }, { once:true });
          const inst = bootstrap.Modal.getInstance(modalEl);
          if (inst) inst.hide();
        });
        const searchInput = document.getElementById(searchId);
        if (searchInput) searchInput.addEventListener('input', () => populateList(listId, searchId, store, countId));
      });
    }

    /* ===========================
       BOOT
    ============================ */
    async function init(){
      showLoader("Iniciando dashboard...");
      await loadData();
      toggleUCFilters();
      updateDashboard();
      setUpModalListeners();

      // Downloads
      document.getElementById('download-bar-csv').addEventListener('click', downloadBarChartCSV);
      document.getElementById('download-bar-png').addEventListener('click', () =>
        downloadChartPNG(barChart, `ranking-${currentDataset}-${yearFilter.value}.png`)
      );
      document.getElementById('download-line-csv').addEventListener('click', downloadLineChartCSV);
      document.getElementById('download-line-png').addEventListener('click', () =>
        downloadChartPNG(lineChart, `serie-historica-top10-${currentDataset}-${yearFilter.value}.png`)
      );
      document.getElementById('download-yearly-csv').addEventListener('click', downloadYearlyChartCSV);
      document.getElementById('download-yearly-png').addEventListener('click', () =>
        downloadChartPNG(yearlyChart, `serie-historica-anual-${currentDataset}.png`)
      );
      document.getElementById('download-map-png').addEventListener('click', downloadMapAsPNG);

      // Filtros
      exploracaoFilter.addEventListener('change', ()=>{ currentCategoryFilter = exploracaoFilter.value; showLoader("Atualizando..."); setTimeout(updateDashboard,100); });
      categoriaFilter.addEventListener('change', async ()=>{
        currentDataset = categoriaFilter.value;
        selectedTerras=[]; selectedMunicipios=[]; selectedEstados=[];
        selectedImoveis=[]; selectedAssentamentos=[]; selectedTerrasSemDestinacao=[]; selectedUCs=[];
        showLoader("Carregando novo conjunto de dados...");
        await loadData(); toggleUCFilters(); updateDashboard();
      });
      jurisdicaoFilter.addEventListener('change', ()=>{ showLoader("Filtrando..."); setTimeout(updateDashboard,100); });
      usoFilter.addEventListener('change', ()=>{ showLoader("Filtrando..."); setTimeout(updateDashboard,100); });
      document.getElementById('apply-filters').addEventListener('click', ()=>{ showLoader("Aplicando filtros..."); setTimeout(updateDashboard,100); });
      yearFilter.addEventListener('change', ()=>{ showLoader('Atualizando...'); setTimeout(updateDashboard,50); });
      estadoFilter.addEventListener('change', ()=>{ showLoader('Atualizando...'); setTimeout(updateDashboard,50); });

      document.getElementById('clear-selections').addEventListener('click', ()=>{
        selectedTerras=[]; selectedMunicipios=[]; selectedEstados=[];
        selectedImoveis=[]; selectedAssentamentos=[]; selectedTerrasSemDestinacao=[]; selectedUCs=[];
        currentCategoryFilter='all'; exploracaoFilter.value='all'; faseFilter.value='all';
        estadoFilter.value='all'; categoriaFilter.value='terras';
        jurisdicaoFilter.value='all'; usoFilter.value='all'; toggleUCFilters();
        const yearsInSelect = Array.from(yearFilter.options).map(o=>+o.value).filter(Boolean);
        const maxYear = yearsInSelect.length ? Math.max(...yearsInSelect) : new Date().getFullYear();
        yearFilter.value = String(maxYear);
        document.querySelectorAll('.modal.show').forEach(m=>{ const inst=bootstrap.Modal.getInstance(m); if (inst) inst.hide(); });
        showLoader("Limpando seleções..."); setTimeout(updateDashboard,100);
      });

      // Toggle de downloads
      document.querySelectorAll('.dl-toggle').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const header = btn.closest('.card-header');
          const group  = header.querySelector('.download-group');
          const hidden = group.classList.toggle('d-none');
          btn.setAttribute('aria-pressed', hidden?'true':'false');
          btn.innerHTML = hidden ? '<i class="fas fa-eye me-1"></i>Mostrar' : '<i class="fas fa-eye-slash me-1"></i>Ocultar';
        });
      });
    }

    init();
  </script>
</body>
</html>
